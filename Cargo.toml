[package]
name = "anpio-key"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local daemon that holds did:wba Ed25519 private keys and signs RFC 9421 HTTP messages on behalf of agents"
license = "Apache-2.0"

[dependencies]
# —— 上游接口:did:wba 文档 + supplied-public-key E1 builder + 两阶段签名
# default-features = false 是关键:默认会拉进 mls(openmls/rusqlite)与 network(reqwest),
# 不启用上游联网/MLS；本地授权持久化单独使用受限 SQLite 依赖。
anp = { version = "=1.0.6", default-features = false }

# —— MCP:官方 Rust SDK。**可选** —— 不装 MCP 的人不该被拖进它的依赖树。
# 0.15.0 是计划里pin 住的那一版(2026-02-10)。注意 crates.io 上它已经不是最新的
# (3.5.1),而且 1.x 之后 API 变过(`#[tool_router(server_handler)]`、
# `serve_with_lifecycle` 都是 3.x 才有的)—— 所以这里跟着计划钉住,别顺手升。
rmcp = { version = "0.15", optional = true, features = ["server", "transport-io", "macros", "schemars"] }

# —— 本地状态：固定版本，bundled 避免系统 SQLite 语义漂移。
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }

# —— 运行时
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "signal", "sync"] }

# —— 内核凭证 / 文件权限
nix = { version = "0.31", features = ["socket", "user", "fs", "term"] }
bip39 = { version = "3", default-features = false, features = ["zeroize"] }

# —— 密码学(版本对齐 anp 1.0.6,避免同一 crate 出现两份)
ed25519-dalek = { version = "=2.1.1", features = ["zeroize", "rand_core"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2"

# —— 内存卫生
zeroize = { version = "1", features = ["derive"] }
shrouded = "0.2"

# —— 编码 / 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
# RFC 8785 JSON 规范化:thumbprint 与 AAD 的输入。上游计划写的 `jcs` 在 crates.io 上不存在。
serde_json_canonicalizer = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# —— CLI / 日志
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
percent-encoding = "2"

[features]
default = []
# 默认关闭:不带它编译,导出代码在二进制里根本不存在
seed-export = []
# MCP 前端(stdin/stdout 上的 4 个工具)。单独开,免得不用 MCP 的人也把 rmcp 拖进来。
mcp = ["dep:rmcp"]
# —— M5 硬件根。三根各自一个特性,都不进默认构建。
#
# `hardware-software` 是**测试替身**,不是硬件:它把 HS 写成一个文件,好让
# v2 记录格式在任何机器上都测得了。`probe` 不会把它算成一根根
# (`is_hardware()` 返回 false)。
hardware-software = []
# macOS Secure Enclave。**注意:要分发给别人就得有 Apple 签发的证书** ——
# SE 私钥只能靠钥匙串持久化,而写钥匙串要 `application-identifier` 这个
# entitlement,那个只有正式签名才给得起。详见 README。
hardware-se = [
    "dep:core-foundation",
    "dep:security-framework",
    "dep:security-framework-sys",
]
# Linux TPM 2.0。没有上面那道门槛:不需要 entitlement,`swtpm` 还能本地模拟。
hardware-tpm = ["dep:tss-esapi"]
# **仅限验收**:让 `examples/se-persistence.rs` 用真 SE 做"进程 A 建、进程 B 开"。
# 不开这个特性,那段代码连同删除动作都不在二进制里;正式发行构建不要带它。
se-acceptance = ["hardware-se"]
# **仅限验收**:让 `examples/tpm-persistence.rs` 用真 TPM 做"进程 A 封、进程 B 开"。
# 和 `se-acceptance` 一样默认关闭,正式发行构建不要带它。
tpm-acceptance = ["hardware-tpm"]

# 验收工具不是发行命令:只在明确要跑 SE 持久化验收时构建。
[[example]]
name = "se-persistence"
required-features = ["hardware-se", "se-acceptance"]

# TPM 的跨进程验收工具,同样不是发行命令。
[[example]]
name = "tpm-persistence"
required-features = ["hardware-tpm", "tpm-acceptance"]

# 签名核心的吞吐基线。没有 harness(不需要 criterion):只打印每操作耗时,
# 用来判断连接模型和锁范围该不该动,不做回归门禁。
[[bench]]
name = "sign_throughput"
harness = false

# ————————————————————————————————————————————————————————————————————————
# 平台相关的依赖。**放在文件末尾是有意的** —— TOML 的 `[table]` 一直管到
# 下一个表头,把 `[target...]` 插在 `[dependencies]` 中间会让后面那些行
# 悄悄落进目标表里,在本机上就"找不到 crate"了。
# ————————————————————————————————————————————————————————————————————————

# 第三层:可执行文件身份。macOS 上要经 CoreFoundation 调 Security.framework
# 的 SecCode API,把对端的 audit token 换成 cdhash。
#
# 另外三个是 M5 的 SE 后端(`hardware-se`)。**可选**:不绑 SE 的人不该被拖进
# 这些依赖。
#
# - `core-foundation` 是安全封装(Enums 而不是裸指针),拼
#   `SecKeyCreateWithData` 那个属性字典要用它。
# - `security-framework-sys` 是必要的 —— 安全封装 crate **没有**包
#   `SecKeyCreateWithData`,而 SE 的 ECDH 要拿一把临时公钥去算,那把钥匙必须
#   从信封里的原始字节建出来。
# - `OSX_10_15` 那个特性也是必要的,而且很容易漏:SE 私钥必须存在**数据保护
#   钥匙串**里,而 `Location::DataProtectionKeychain` 和
#   `kSecUseDataProtectionKeychain` 两个名字都在这个特性后面。少了它,造钥匙
#   和按标签找回会**落在两个不同的钥匙串上**,症状是"刚存的钥匙找不到"。
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = "0.8"
security-framework = { version = "3.7", optional = true, features = ["OSX_10_15"] }
security-framework-sys = { version = "2.14", optional = true }

# M5 的 TPM 后端(`hardware-tpm`)。**只对 Linux 成立** —— `tss-esapi-sys`
# 的构建脚本在别的平台上会直接 panic,而且它本来就是在跟 `/dev/tpmrm0`
# 说话,别的平台上那个设备不存在。目标门控是必须的,不是整洁。
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7.7", optional = true }

# ————————————————————————————————————————————————————————————————————————
# 构建产物的大小。**同样放在末尾是有意的** —— 理由和上面那段一样。
# ————————————————————————————————————————————————————————————————————————

# 只压依赖,不压自己:anpio-key 的帧照旧带完整的类型和变量,依赖的帧退到
# 行号表(文件 + 行号还在,`args` 之类没了)。实测全新默认构建的 deps 从
# 762M 掉到 626M。目标目录里更大的那几 G 不在这里,而是历次特性组合攒下的
# 变体(`cargo clean --profile dev` 才是那一刀)。
# 想连依赖的变量也留,把 "line-tables-only" 换成 2;想一个字节都不留,换成 false。
[profile.dev.package."*"]
debug = "line-tables-only"
