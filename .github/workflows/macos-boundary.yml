name: macOS local boundary preview
on:
  push:
    paths: ['src/**', 'tests/**', 'examples/**', 'deploy/macos/**', 'deploy/tests/**', 'install.sh', 'Cargo.*', '.github/workflows/macos-boundary.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'deploy/macos/**', 'deploy/tests/**', 'install.sh', 'Cargo.*', '.github/workflows/macos-boundary.yml']
permissions:
  contents: read
jobs:
  local-preview:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Entry-point lint (bash 3.2 parse and full-width adjacency)
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Installer identity policy (no host changes)
        run: python3 -m unittest discover -s deploy/macos/tests -p 'test_*.py'
      - name: Regression tests
        env:
          RUST_LOG: info
        run: cargo test --locked --features mcp
      - name: Strict lint
        run: cargo clippy --locked --all-targets --features mcp,hardware-se -- -D warnings
      - name: SE bridge software regressions (physical acceptance remains separate)
        env:
          RUST_LOG: info
        run: cargo test --locked --features mcp,hardware-se --lib
      - name: Local release stays preview
        run: |
          cargo build --locked --release --features mcp
          target/release/anpio-key build-info | python3 -c 'import json,sys; i=json.load(sys.stdin); assert i["release"] and not i["protected_supported"] and not i["seed_export"] and not i["hardware_software"]'
      - name: Install is idempotent and upgrade with the same digest is a no-op
        run: |
          digest=$(shasum -a 256 target/release/anpio-key | awk '{print $1}')
          sudo ./install.sh --binary target/release/anpio-key --sha256 "$digest" --admin-user "$USER"
          ./install.sh --status
          ./install.sh
          ./install.sh --upgrade --binary target/release/anpio-key --sha256 "$digest"
      - name: Uninstall stops the job but keeps config, state and accounts
        run: |
          sudo ./install.sh --uninstall
          test ! -e /Library/ANPIOKey/bin/anpio-key
          test ! -e /Library/LaunchDaemons/org.anpio-key.local.plist
          test -f /Library/ANPIOKey/service.json
          rc=0; ./install.sh || rc=$?
          test "$rc" = 2
          ./install.sh --status

  signing-harness-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise temporary signing harness in disposable Linux domain
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          rust:1.90-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f
          bash deploy/macos/acceptance/test-signing-container.sh
