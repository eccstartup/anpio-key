name: Linux boundary acceptance
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/linux/**'
      - 'adapters/**'
      - 'Cargo.*'
      - '.github/workflows/linux-boundary.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/linux/**'
      - 'adapters/**'
      - 'Cargo.*'
      - '.github/workflows/linux-boundary.yml'
permissions:
  contents: read
jobs:
  multi-uid:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: '1.88'
            test_mcp: '0'
            image: rust:1.88-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
          - rust: '1.90'
            test_mcp: '1'
            image: rust:1.90-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node v2 adapter syntax
        run: |
          node --check adapters/anpio-key-v2.mjs
          node --check adapters/test-sdk.mjs
      - name: Build and test disposable service/admin/Agent domains
        run: >-
          docker run --rm
          -e ANPIO_KEY_TEST_MCP=${{ matrix.test_mcp }}
          -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          "${{ matrix.image }}"
          bash deploy/linux/acceptance/test-container.sh
